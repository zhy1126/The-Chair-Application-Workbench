<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offline graduate application tracker with fictional example data">
  <title>The Chair Application Workbench</title>
  <style>
    :root{--ink:#20252d;--muted:#6a737d;--line:#d9dee5;--paper:#f5f6f7;--white:#fff;--accent:#2c5f8f;--hk:#e8eef6;--us:#f4edd2;--uk:#e6eee2;--sg:#e5eef2}
    *{box-sizing:border-box} html{font-size:16px} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.45}
    .wrap{max-width:1480px;margin:0 auto;padding:34px 30px 54px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.top h1{margin:0;font-size:clamp(1.7rem,3vw,2.35rem);font-weight:700;letter-spacing:-.035em}.top p{margin:7px 0 0;color:var(--muted);font-size:.95rem}.updated{color:var(--muted);font-size:.78rem;white-space:nowrap}.table-shell{background:var(--white);border:1px solid var(--line);overflow:auto}.tracker{width:100%;min-width:1180px;border-collapse:collapse;table-layout:fixed}.tracker th{background:#eef0f2;color:#343b44;text-align:left;font-size:.78rem;letter-spacing:.04em;font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}.tracker th:nth-child(1){width:8%}.tracker th:nth-child(2){width:14%}.tracker th:nth-child(3){width:16%}.tracker th:nth-child(4){width:15%}.tracker th:nth-child(5){width:24%}.tracker th:nth-child(6){width:15%}.tracker th:nth-child(7){width:8%}.tracker td{vertical-align:top;padding:15px 14px;border-bottom:1px solid var(--line);font-size:.9rem}.tracker tr:last-child td{border-bottom:0}.area{font-weight:650}.region-hong-kong{background:var(--hk)}.region-us{background:var(--us)}.region-uk{background:var(--uk)}.region-singapore{background:var(--sg)}.school a,.program a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid #94a8bb}.school a:hover,.program a:hover{color:var(--accent);border-color:var(--accent)}.program small{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.deadline{font-variant-numeric:tabular-nums}.deadline strong{display:block;font-weight:700}.deadline span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.req{color:#414951}.req .tag{display:inline-block;color:#4d5965;background:#f0f2f4;border-radius:4px;padding:2px 6px;margin:0 3px 4px 0;font-size:.76rem}.req-note{font-size:.78rem;color:var(--muted);margin-top:5px}.fee{font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere}.status{width:100%;border:1px solid #c8d1db;border-radius:5px;padding:7px 5px;background:#fff;color:var(--ink);font:inherit;font-size:.78rem}.status:focus,.toolbar select:focus-visible,.toolbar button:focus-visible,#color-picker:focus-visible{outline:2px solid #91b4d1;outline-offset:1px}.detail{margin-top:8px;color:var(--muted);font-size:.76rem}.detail summary{cursor:pointer;color:var(--accent);font-weight:650}.detail p{margin:8px 0}.sources{display:flex;flex-wrap:wrap;gap:8px}.sources a{color:var(--accent);text-decoration:none}.sources a:hover{text-decoration:underline}.foot{margin-top:14px;display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:.78rem}.foot a{color:var(--accent)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;margin-top:20px;padding:12px 14px;background:var(--white);border:1px solid var(--line);border-bottom:0}
    .toolbar-group{display:flex;align-items:center;gap:9px;min-height:34px}
    .toolbar-label{color:var(--muted);font-size:.78rem;font-weight:700;white-space:nowrap}
    .sort-options{display:inline-flex;gap:2px;padding:2px;border:1px solid #c8d1db;border-radius:6px;background:#f4f6f8}
    .sort-button{border:0;border-radius:4px;padding:6px 10px;background:transparent;color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer}
    .sort-button.active{background:var(--accent);color:#fff;font-weight:700}
    .color-toolbar select{min-width:150px;max-width:190px;height:32px;padding:0 8px;border:1px solid #c8d1db;border-radius:5px;background:#fff;font:inherit;font-size:.8rem}
    #color-picker{width:36px;height:32px;padding:2px;border:1px solid #acb5bf;border-radius:5px;cursor:pointer}
    #reset-color{height:32px;border:0;background:transparent;color:var(--accent);font:inherit;font-size:.78rem;cursor:pointer}
    .toolbar :disabled{cursor:not-allowed;opacity:.45}
    @media (max-width:1180px){.wrap{padding:24px 14px 40px}.top{display:block}.updated{margin-top:10px}.toolbar{border:1px solid var(--line);border-radius:7px;margin-bottom:12px}.table-shell{background:transparent;border:0;overflow:visible}.tracker,.tracker tbody,.tracker tr,.tracker td{display:block;width:100%;min-width:0}.tracker{border:0}.tracker thead{display:none}.tracker tr{background:#fff;border:1px solid var(--line);margin:0 0 12px;padding:0;border-radius:7px;overflow:hidden}.tracker td{border:0;border-bottom:1px solid #edf0f2;padding:10px 13px}.tracker td.area-empty{display:none}.tracker td:last-child{border-bottom:0}.tracker td::before{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.05em;font-weight:700;margin-bottom:3px}.tracker td:nth-child(1)::before{content:"AREA"}.tracker td:nth-child(2)::before{content:"SCHOOL"}.tracker td:nth-child(3)::before{content:"PROGRAM"}.tracker td:nth-child(4)::before{content:"DDL"}.tracker td:nth-child(5)::before{content:"REQUIREMENT"}.tracker td:nth-child(6)::before{content:"APPLICATION FEE"}.tracker td:nth-child(7)::before{content:"STATUS"}.foot{display:block}.foot span{display:block;margin-top:5px}}
    @media (max-width:600px){.toolbar{align-items:stretch}.toolbar-group{flex-wrap:wrap}.color-toolbar{width:100%}.color-toolbar select{flex:1;min-width:140px;max-width:none}}
    @media (max-width:1180px){.tracker tr.region-hong-kong{background:var(--hk)}.tracker tr.region-us{background:var(--us)}.tracker tr.region-uk{background:var(--uk)}.tracker tr.region-singapore{background:var(--sg)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>The Chair Application Workbench</h1><p>离线申请追踪表 · 当前内容为虚构示例</p></div>
      <div class="updated">通用模板 · v1.0.1</div>
    </header>
    <section class="toolbar" aria-label="表格设置">
      <div class="toolbar-group">
        <span class="toolbar-label">排序</span>
        <div class="sort-options" role="group" aria-label="排序方式">
          <button type="button" class="sort-button active" data-sort="region" aria-pressed="true">按地区</button>
          <button type="button" class="sort-button" data-sort="deadline" aria-pressed="false">按截止时间</button>
        </div>
      </div>
      <div class="toolbar-group color-toolbar">
        <label class="toolbar-label" for="color-target">行颜色</label>
        <select id="color-target" aria-label="选择要调整颜色的项目"><option value="">选择项目</option></select>
        <input id="color-picker" type="color" aria-label="所选项目的颜色" title="选择颜色" disabled>
        <button id="reset-color" type="button" disabled>恢复默认</button>
      </div>
    </section>
    <div class="table-shell">
      <table class="tracker">
        <thead><tr><th>Area</th><th>School</th><th>Program</th><th>DDL</th><th>Requirement</th><th>Application Fee</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer class="foot"><span>填写真实项目前请核对官方信息；颜色和状态保存在当前浏览器。</span><span>示例数据仅用于演示，不代表真实项目或申请计划。</span></footer>
  </main>
  <script>
    const applications = [
  {
    "area": "U.S.",
    "region": "us",
    "school": "University A",
    "program": "PhD · Example programme",
    "schoolUrl": "https://example.com/",
    "programUrl": "https://example.com/",
    "ddl": "2027-12-01",
    "ddlSub": "虚构日期，仅演示排序",
    "fee": "US$100 · 示例金额",
    "req": [
      "成绩单 / Transcript",
      "个人陈述 / Statement",
      "推荐信 / References"
    ],
    "note": "虚构学校与申请要求；请在源码的 applications 列表中替换为自己的项目信息。",
    "source": "https://example.com/"
  },
  {
    "area": "U.K.",
    "region": "uk",
    "school": "University B",
    "program": "Master · Example programme",
    "schoolUrl": "https://example.com/",
    "programUrl": "https://example.com/",
    "ddl": "2027-11-15",
    "ddlSub": "虚构日期，仅演示排序",
    "fee": "£75 · 示例金额",
    "req": [
      "成绩单 / Transcript",
      "个人陈述 / Statement",
      "推荐信 / References"
    ],
    "note": "虚构学校与申请要求；请在源码的 applications 列表中替换为自己的项目信息。",
    "source": "https://example.com/"
  },
  {
    "area": "Hong Kong",
    "region": "hong-kong",
    "school": "University C",
    "program": "PhD · Example programme",
    "schoolUrl": "https://example.com/",
    "programUrl": "https://example.com/",
    "ddl": "待公布",
    "ddlSub": "虚构日期，仅演示排序",
    "fee": "待核对 · 示例",
    "req": [
      "成绩单 / Transcript",
      "个人陈述 / Statement",
      "推荐信 / References"
    ],
    "note": "虚构学校与申请要求；请在源码的 applications 列表中替换为自己的项目信息。",
    "source": "https://example.com/"
  }
];
    const statusKey='chair-public-demo-status-v1';
    const colorKey='chair-public-demo-row-colors-v1';
    const regionColors={singapore:'#e5eef2','hong-kong':'#e8eef6',us:'#f4edd2',uk:'#e6eee2'};
    const regionNames={singapore:'Singapore','hong-kong':'Hong Kong',us:'U.S.',uk:'U.K.'};
    const regionOrder={singapore:0,'hong-kong':1,us:2,uk:3};
    const rowKey=item=>item.school+'|'+item.program;
    const storage={
      getItem(key){try{return localStorage.getItem(key)}catch{return null}},
      setItem(key,value){try{localStorage.setItem(key,value)}catch{}}
    };
    let savedColors={};
    try{savedColors=JSON.parse(storage.getItem(colorKey)||'{}')||{}}catch{savedColors={}}
    let saved={};
    try{saved=JSON.parse(storage.getItem(statusKey)||'{}')||{}}catch{saved={}}
    const labels=['未开始','准备中','已提交'];
    const rows=document.getElementById('rows');
    const colorTarget=document.getElementById('color-target');
    const colorPicker=document.getElementById('color-picker');
    const resetColor=document.getElementById('reset-color');
    const rowElements=new Map();
    let sortMode='region';

    applications.forEach(item=>colorTarget.add(new Option(item.school,rowKey(item))));

    function applyRowColor(tr,hex){
      if(!tr)return;
      if(hex){
        const rgb=[1,3,5].map(offset=>parseInt(hex.slice(offset,offset+2),16));
        tr.style.backgroundColor=`rgba(${rgb.join(',')},0.16)`;
        tr.style.boxShadow=`inset 4px 0 ${hex}`;
      }else{
        tr.style.backgroundColor='';
        tr.style.boxShadow='';
      }
    }

    function updateColorToolbar(){
      const item=applications.find(entry=>rowKey(entry)===colorTarget.value);
      const hex=item&&savedColors[rowKey(item)];
      colorPicker.disabled=!item;
      resetColor.disabled=!hex;
      colorPicker.value=hex||regionColors[item?.region]||'#ffffff';
      colorPicker.style.backgroundColor=colorPicker.value;
    }

    function renderRows(){
      const ordered=applications.map((item,index)=>({item,index}));
      if(sortMode==='deadline'){
        ordered.sort((a,b)=>{
          const dateA=/^\d{4}-\d{2}-\d{2}$/.test(a.item.ddl)?a.item.ddl:'9999-12-31';
          const dateB=/^\d{4}-\d{2}-\d{2}$/.test(b.item.ddl)?b.item.ddl:'9999-12-31';
          return dateA.localeCompare(dateB)||a.index-b.index;
        });
      }else{
        ordered.sort((a,b)=>regionOrder[a.item.region]-regionOrder[b.item.region]||a.index-b.index);
      }
      rows.replaceChildren();
      rowElements.clear();
      ordered.forEach(({item,index},position)=>{
        const tr=document.createElement('tr');
        tr.className='region-'+item.region;
        const showArea=sortMode==='deadline'||position===0||ordered[position-1].item.region!==item.region;
        const area=showArea?`<td class="area">${regionNames[item.region]}</td>`:'<td class="area-empty" aria-label="同上"></td>';
        tr.innerHTML=`${area}<td class="school"><a href="${item.schoolUrl}" target="_blank" rel="noopener">${item.school} ↗</a></td><td class="program"><a href="${item.programUrl}" target="_blank" rel="noopener">${item.program} ↗</a></td><td class="deadline"><strong>${item.ddl}</strong><span>${item.ddlSub}</span></td><td class="req"><div>${item.req.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><div class="req-note">${item.note}</div><details class="detail"><summary>详情与项目链接</summary><p>${item.note}</p><div class="sources"><a href="${item.source}" target="_blank" rel="noopener">打开项目链接 ↗</a></div></details></td><td class="fee">${item.fee}</td><td><select class="status" aria-label="${item.school} 状态">${labels.map(label=>`<option>${label}</option>`).join('')}</select></td>`;
        rows.appendChild(tr);
        const select=tr.querySelector('.status');
        select.value=saved[index]||labels[0];
        select.addEventListener('change',()=>{saved[index]=select.value;storage.setItem(statusKey,JSON.stringify(saved));});
        rowElements.set(rowKey(item),tr);
        const hex=savedColors[rowKey(item)];
        applyRowColor(tr,/^#[0-9a-f]{6}$/i.test(hex)?hex:null);
      });
    }

    document.querySelectorAll('.sort-button').forEach(button=>button.addEventListener('click',()=>{
      sortMode=button.dataset.sort;
      document.querySelectorAll('.sort-button').forEach(option=>{
        const active=option===button;
        option.classList.toggle('active',active);
        option.setAttribute('aria-pressed',active);
      });
      renderRows();
    }));
    colorTarget.addEventListener('change',updateColorToolbar);
    colorPicker.addEventListener('input',()=>{
      const key=colorTarget.value;
      if(!key)return;
      savedColors[key]=colorPicker.value;
      storage.setItem(colorKey,JSON.stringify(savedColors));
      applyRowColor(rowElements.get(key),colorPicker.value);
      updateColorToolbar();
    });
    resetColor.addEventListener('click',()=>{
      const key=colorTarget.value;
      if(!key)return;
      delete savedColors[key];
      storage.setItem(colorKey,JSON.stringify(savedColors));
      applyRowColor(rowElements.get(key),null);
      updateColorToolbar();
    });
    renderRows();
    updateColorToolbar();
  </script>
</body>
</html>
